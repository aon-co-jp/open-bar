[package]
name = "open-bar"
version = "0.1.0"
edition = "2021"
description = "open-bar: foobar2000-inspired high-resolution audio/video player core (PCM/DSD/DoP/MQA-passthrough planning) in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aon-co-jp/open-bar"

[lib]
name = "open_bar"
path = "src/lib.rs"

[[bin]]
name = "open-bar"
path = "src/main.rs"

[dependencies]
# 荳ｻ隕√↑髻ｳ螢ｰ繝輔か繝ｼ繝槭ャ繝医・繝・さ繝ｼ繝峨・繝・・繝ｫ繝√・繝ｬ繧ｯ繧ｹ(邏燃ust)縲・KV/MP4縺ｮ髻ｳ螢ｰ繝医Λ繝・け繧りｪｭ繧√ｋ縲・
symphonia = { version = "0.5", features = ["all"] }
# DoP(DSD over PCM)繝代ャ繧ｭ繝ｳ繧ｰ縺ｨ邏燃ust Opus繝・さ繝ｼ繝・閾ｪ繝ｪ繝昴ず繝医Μ鄒､縺ｮ open-mqa)縲・
open-mqa = { git = "https://github.com/aon-co-jp/open-mqa", rev = "2d94ada", default-features = false, features = ["opus"] }
# DSD(DSF/DSDIFF)隱ｭ縺ｿ霎ｼ縺ｿ繝ｻDSD竊単CM繝ｻDoP(open-mqa-dsd)縲・
open-mqa-dsd = { git = "https://github.com/aon-co-jp/open-mqa-dsd", rev = "ce94b46" }
# CPU蜻ｽ莉､繧ｻ繝・ヨ讀懷・(DSD竊単CM螟画鋤縺ｮ鬮倬溘き繝ｼ繝阪Ν驕ｸ謚槭↓菴ｿ縺・∥on-co-jp蜈ｱ騾・縲・
open-cpu = { git = "https://github.com/aon-co-jp/open-cpu" }
# 音声出力(共有モード)と高品質リサンプル。`[target.windows]`のwasapiは排他モード用。
cpal = "0.15"
rubato = "0.15"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"



[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
